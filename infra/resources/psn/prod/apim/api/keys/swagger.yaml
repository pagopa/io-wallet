openapi: 3.0.1
info:
  title: IT-Wallet User - Keys v1
  description: Provides cryptographic operations for keys in the application Key Vault pool
  version: v1
paths:
  /{keyName}/signatures:
    post:
      summary: Sign a digest
      description: Signs an encoded digest using the specified Key Vault key
      operationId: sign-digest
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alg
                - value
              properties:
                alg:
                  type: string
                  description: Key Vault JSON Web Key signing algorithm
                value:
                  type: string
                  description: Encoded digest to sign
      responses:
        "200":
          description: Signature generated
          content:
            application/json:
              schema:
                type: object
                required:
                  - kid
                  - value
                properties:
                  kid:
                    type: string
                    description: Key identifier used for signing
                  value:
                    type: string
                    description: Encoded signature
        "400":
          description: Invalid signing request
        "401":
          description: APIM managed identity is not authorized to access the Key Vault
        "403":
          description: The selected Key Vault key does not allow signing
        "502":
          description: The signing backend could not complete the request