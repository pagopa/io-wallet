name: Deploy Function App PSN (user-func)

on:
  workflow_dispatch:
    inputs:
      function_app:
        description: Function app to deploy
        type: choice
        required: true
        default: both
        options:
          - both
          - iw-p-itn-user-func-01
          - iw-p-itn-user-func-02
  push:
    branches:
      - master
    paths:
      - "apps/io-wallet-user-func/CHANGELOG.md"

permissions:
  attestations: write
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy (${{ matrix.web_app_name }})
    strategy:
      fail-fast: false
      matrix:
        web_app_name: >-
          ${{ fromJSON(
            inputs.function_app && inputs.function_app != 'both'
            && format('["{0}"]', inputs.function_app)
            || '["iw-p-itn-user-func-01","iw-p-itn-user-func-02"]'
          ) }}
    uses: pagopa/dx/.github/workflows/release-azure-appsvc-v1.yaml@main
    secrets: inherit
    with:
      workspace_name: io-wallet-user-func
      environment: app-psn-prod
      resource_group_name: iw-p-itn-wallet-rg-01
      web_app_name: ${{ matrix.web_app_name }}
      disable_auto_staging_deploy: true
      use_labels: true
      override_labels: psn
