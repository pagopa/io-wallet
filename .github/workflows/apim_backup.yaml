name: APIM Backup

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apim-production-maintenance
  cancel-in-progress: false

env:
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  AZURE_CORE_OUTPUT: none

jobs:
  backup:
    name: Back up production APIM
    runs-on: ubuntu-latest
    environment: infra-psn-prod-cd
    timeout-minutes: 180

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      APIM_NAME: iw-p-itn-apps-apim-01
      APIM_RESOURCE_GROUP: iw-p-itn-wallet-rg-01
      BACKUP_STORAGE_ACCOUNT_NAME: iwpitnapimbackupst01
      BACKUP_STORAGE_ACCOUNT_RESOURCE_GROUP: iw-p-itn-wallet-rg-01
      BACKUP_CONTAINER_NAME: apim-backups

    steps:
      - name: Cloud Login
        uses: pagopa/dx/actions/csp-login@main

      - name: Back up APIM
        shell: bash
        run: |
          set -euo pipefail

          backup_name="${APIM_NAME}-$(date -u +%Y%m%dT%H%M%SZ).apimbackup"
          storage_key="$(az storage account keys list \
            --resource-group "$BACKUP_STORAGE_ACCOUNT_RESOURCE_GROUP" \
            --account-name "$BACKUP_STORAGE_ACCOUNT_NAME" \
            --query "[0].value" \
            --output tsv)"
          echo "::add-mask::$storage_key"

          az apim backup \
            --resource-group "$APIM_RESOURCE_GROUP" \
            --name "$APIM_NAME" \
            --storage-account-name "$BACKUP_STORAGE_ACCOUNT_NAME" \
            --storage-account-key "$storage_key" \
            --storage-account-container "$BACKUP_CONTAINER_NAME" \
            --backup-name "$backup_name"

          echo "APIM backup '$backup_name' completed."

      - name: Notify Slack on failure
        if: failure()
        uses: pagopa/dx/.github/actions/slack-notification@53f4c4a596dcfb846b933568ed5dd12fcadfd61e # main
        with:
          id: "APIM Backup"
          title: "*APIM Backup Failure*"
          text: "The backup of '${{ env.APIM_NAME }}' failed. Check the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run> for details."
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
